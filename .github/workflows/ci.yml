# Continuous integration. Runs on every push and pull request; builds images on tags.
# STATUS: written and YAML-validated; NOT yet executed (repository has no CI runs yet).
name: ci

on:
  push:
    branches: [main, "release/**"]
    tags: ["v*"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gagetracker
          POSTGRES_PASSWORD: gagetracker
          POSTGRES_DB: gagetracker_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gagetracker" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://gagetracker:gagetracker@localhost:5432/gagetracker_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - name: Lint (syntax + pyflakes)
        run: ruff check app tests scripts alembic
      - name: Tests (includes migrations up/down/up and statistical validation)
        run: pytest -q
      - name: Migrations match the models
        run: DATABASE_URL=$TEST_DATABASE_URL alembic check
      - name: Dependency audit
        run: pip install pip-audit==2.9.0 && pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - name: Type checking
        run: npx tsc --noEmit
      - name: Unit tests
        run: npx vitest run
      - name: Production build
        run: npm run build
        env: { API_URL: "http://api:8000", NEXT_TELEMETRY_DISABLED: "1" }
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

  images:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker build -t gagetracker-api:${GITHUB_REF_NAME#v} backend
          docker build --build-arg API_URL=http://api:8000 -t gagetracker-web:${GITHUB_REF_NAME#v} frontend
      - name: Validate deployment compose file
        run: |
          cp deploy/.env.example deploy/.env
          docker compose -f deploy/docker-compose.yml --env-file deploy/.env config --quiet
