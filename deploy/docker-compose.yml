# Gage Tracker — production / private deployment stack.
#
#   cp deploy/.env.example deploy/.env      # then set every value marked REQUIRED
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
#
# Services: PostgreSQL, one-shot migrations, API, background worker, web front end and
# Caddy as HTTPS reverse proxy (automatic certificates for a public domain, or an
# internal CA for private networks). Only the proxy publishes ports.
# STATUS: written and syntax-checked; NOT yet executed (Docker was not available on the
# development machine). See docs/DEPLOYMENT_PRIVATE.md.

name: gagetracker

x-backend: &backend
  build: ../backend
  image: gagetracker-api:${GT_VERSION:-1.0.0-rc.1}
  restart: unless-stopped
  environment: &backend-env
    APP_ENV: production
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:?SECRET_ENCRYPTION_KEY is required}
    BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
    ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-60}
    CORS_ORIGINS: https://${GT_DOMAIN}
    ALLOW_SELF_REGISTRATION: ${ALLOW_SELF_REGISTRATION:-false}
    STORAGE_DIR: /data/storage
    MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    LOG_JSON: "true"
    WEBHOOK_ALLOW_HTTP: "false"
    SCHEDULER_ENABLED: "false"          # jobs run only in the worker service
  volumes:
    - storage:/data/storage
  depends_on:
    db: { condition: service_healthy }

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-gagetracker}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 10

  migrate:
    <<: *backend
    restart: "no"
    command: ["alembic", "upgrade", "head"]

  api:
    <<: *backend
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *backend-env
      SCHEDULER_INTERVAL_SECONDS: ${SCHEDULER_INTERVAL_SECONDS:-30}
    healthcheck:
      disable: true
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  web:
    build:
      context: ../frontend
      args: { API_URL: "http://api:8000" }
    image: gagetracker-web:${GT_VERSION:-1.0.0-rc.1}
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }

  proxy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      GT_DOMAIN: ${GT_DOMAIN:?GT_DOMAIN is required}
      GT_TLS: ${GT_TLS:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [web, api]

volumes:
  pgdata:
  storage:
  caddy_data:
